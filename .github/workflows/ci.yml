name: Windows C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup ONNX Runtime
      shell: pwsh
      run: |
        $url = "https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-win-x64-1.17.1.zip"
        Write-Host "[INFO] Downloading ONNX Runtime 1.17.1..."
        Invoke-WebRequest -Uri $url -OutFile "ort.zip"
        
        Write-Host "[INFO] Extracting..."
        Expand-Archive -Path "ort.zip" -DestinationPath "C:\"
        
        Write-Host "[INFO] Renaming directory to match CMake configuration..."
        Rename-Item -Path "C:\onnxruntime-win-x64-1.17.1" -NewName "C:\onnxruntime"

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iocp-onnx-server-release
        path: build/Release/