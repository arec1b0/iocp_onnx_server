name: Windows C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [release, asan]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup ONNX Runtime
      shell: pwsh
      run: |
        $version = '1.18.1'
        $package = "onnxruntime-win-x64-$version"
        $archive = Join-Path $env:RUNNER_TEMP "$package.zip"
        Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$version/$package.zip" -OutFile $archive
        Get-FileHash -LiteralPath $archive -Algorithm SHA256 | Format-List
        Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
        $ort = Join-Path $env:RUNNER_TEMP $package
        foreach ($required in @('include/onnxruntime_cxx_api.h', 'lib/onnxruntime.lib', 'lib/onnxruntime.dll')) {
          if (-not (Test-Path -LiteralPath (Join-Path $ort $required) -PathType Leaf)) {
            throw "Missing ONNX Runtime file $required."
          }
        }
        "CI_ONNXRUNTIME_DIR=$ort" >> $env:GITHUB_ENV

    - name: Locate MSVC ASan runtime
      if: matrix.variant == 'asan'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
        $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.ASAN -property installationPath
        if (-not $vs) { throw 'Visual Studio 2022 with the C++ AddressSanitizer component is required.' }
        $toolVersion = (Get-Content (Join-Path $vs 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
        $runtime = Join-Path $vs "VC/Tools/MSVC/$toolVersion/bin/Hostx64/x64"
        if (-not (Test-Path -LiteralPath (Join-Path $runtime 'clang_rt.asan_dynamic-x86_64.dll'))) {
          throw 'MSVC x64 AddressSanitizer runtime not found.'
        }
        $runtime >> $env:GITHUB_PATH

    - name: Configure CMake
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force build | Out-Null
        $flags = @()
        if ('${{ matrix.variant }}' -eq 'asan') {
          $flags += '-DCMAKE_CXX_FLAGS=/EHsc /Zi /fsanitize=address', '-DCMAKE_EXE_LINKER_FLAGS=/DEBUG:FULL /INCREMENTAL:NO'
        }
        cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 "-DONNXRUNTIME_DIR=$env:CI_ONNXRUNTIME_DIR" @flags 2>&1 | Tee-Object build/configure.log
        exit $LASTEXITCODE

    - name: Build Project
      shell: pwsh
      run: |
        cmake --build build --config Release --parallel 2>&1 | Tee-Object build/build.log
        exit $LASTEXITCODE

    - name: Run all CTest suites
      shell: pwsh
      run: |
        ctest --test-dir build -C Release --output-on-failure --output-log build/ctest.log
        exit $LASTEXITCODE

    - name: Test TCP Protocol
      shell: pwsh
      run: ./tests/ProtocolSmoke.ps1 -ServerExe build/Release/iocp_onnx_server.exe *>&1 | Tee-Object build/tcp-smoke.log

    - name: Test shutdown with blocked stdout
      shell: pwsh
      run: |
        pwsh -NoProfile -NonInteractive -File tests/StdoutBackpressure.ps1 -ServerExe build/Release/iocp_onnx_server.exe -OutputDirectory build/stdout-backpressure
        exit $LASTEXITCODE

    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.variant }}-diagnostics
        path: |
          build/*.log
          build/CMakeFiles/CMakeConfigureLog.yaml
          build/Testing/Temporary/
          build/stdout-backpressure/**/*.log
          build/stdout-backpressure/result.json

    - name: Upload Build Artifacts
      if: matrix.variant == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: iocp-onnx-server-release
        path: build/Release/
